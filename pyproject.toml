[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "signkit"
version = "0.1.0"
description = "Tiny helpers for signing and verifying strings with HMAC"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Shai Lahmish" }]

[tool.setuptools]
packages = ["signkit"]
